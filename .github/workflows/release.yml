name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos-arm64:
    if: ${{ !endsWith(github.ref_name, '-dev') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust engine toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup target add aarch64-apple-darwin --toolchain 1.88.0
      - name: Build macOS Electron installer
        env:
          MINIMALPDF_PREVIEW_NAME: ${{ github.ref_name }}
          CARGO_BUILD_JOBS: 2
        run: |
          pnpm build
          ./scripts/build-electron-macos.sh
          node scripts/smoke-electron-macos.mjs "dist-electron/previews/${GITHUB_REF_NAME}/mac-arm64/MinimalPdfConverter-$(<VERSION)-arm64.dmg"
          shasum -a 256 "dist-electron/previews/${GITHUB_REF_NAME}/mac-arm64/MinimalPdfConverter-$(<VERSION)-arm64.dmg" > "dist-electron/previews/${GITHUB_REF_NAME}/mac-arm64/MinimalPdfConverter-$(<VERSION)-arm64.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ayst-arc-pdf-macos-arm64
          path: dist-electron/previews/${{ github.ref_name }}/mac-arm64/MinimalPdfConverter-*-arm64.dmg*
          if-no-files-found: error

  windows-x64:
    if: ${{ !endsWith(github.ref_name, '-dev') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust engine toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup target add x86_64-pc-windows-msvc --toolchain 1.88.0
      - name: Prepare PDFium runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-pdfium-runtime.ps1 -Destination "$env:GITHUB_WORKSPACE\rust-engine\target\pdfium-windows-x64"
      - name: Prepare LibreOffice runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-libreoffice-windows.ps1 -Destination "$env:GITHUB_WORKSPACE\electron\bin\windows\office"
      - name: Build and smoke-test Windows Electron installer
        shell: pwsh
        env:
          RELEASE_STRICT: '0'
        run: |
          pnpm build
          node scripts/build-electron-windows.mjs
          $installer = Get-ChildItem -LiteralPath dist-electron -Filter '*-x64-Setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant(), $installer.Name | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ayst-arc-pdf-windows-x64
          path: dist-electron/MinimalPdfConverter-*-x64-Setup.exe*
          if-no-files-found: error

  github-release:
    if: ${{ !endsWith(github.ref_name, '-dev') }}
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ayst Arc PDF ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.sha256
