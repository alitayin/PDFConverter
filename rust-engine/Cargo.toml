[package]
name = "minimal-pdf-converter"
version = "0.3.1"
description = "Local-first PDF conversion desktop application"
authors = ["Minimal PDF Converter"]
edition = "2021"
default-run = "minimal-pdf-converter"

[dependencies]
base64 = "=0.22.1"
cfb = "=0.7.3"
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
gif = "=0.14.2"
image-webp = "=0.2.4"
jpeg-decoder = { version = "=0.3.1", default-features = false }
jpeg-encoder = "0.6.0"
png = "0.17.16"
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
quick-xml = "=0.42.0"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svg2pdf = { version = "=0.13.0", default-features = false, features = ["text"] }
thiserror = "2"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw"] }
uuid = { version = "1.11", features = ["v4"] }
url = "2"
zip = { version = "=4.0.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", default-features = true }
foreign-types = "0.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "=0.7.4"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
